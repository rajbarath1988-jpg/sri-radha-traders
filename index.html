  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --green:#1a6b3c; --green-light:#2d9152; --green-pale:#e8f5ee;
    --cream:#faf8f3; --brown:#5c4a32; --orange:#e8651a; --red:#dc2626;
    --blue:#1d4ed8; --purple:#7c3aed;
    --text:#1c1c1c; --text-muted:#7a7060;
    --shadow:0 4px 20px rgba(0,0,0,0.08); --shadow-lg:0 8px 40px rgba(0,0,0,0.14);
    --radius:16px; --radius-sm:10px;
  }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--text); overscroll-behavior-y: contain; touch-action: pan-x pan-y; }
  .app { max-width:430px; margin:0 auto; min-height:100vh; background:var(--cream); position:relative; }
  
  /* \u2500\u2500 DESKTOP RESPONSIVE (768px+) \u2500\u2500 */
  @media (min-width:768px) {
    body { background:#f0ede6; }
    .app { max-width:100%; display:grid; grid-template-columns:280px 1fr; grid-template-rows:auto 1fr; min-height:100vh; margin:0; }
    
    /* Header spans full width */
    .header { grid-column:1 / -1; padding:16px 32px 20px; }
    .header h2 { font-size:22px; }

    /* Bottom nav becomes left sidebar */
    .bottom-nav {
      position:fixed; left:0; top:0; bottom:0;
      width:280px; flex-direction:column; border-top:none;
      border-right:1px solid #e8e4dc; padding:100px 0 20px;
      justify-content:flex-start; gap:4px; height:100vh;
      transform:none; box-shadow:4px 0 20px rgba(0,0,0,0.06);
    }
    .nav-item { flex-direction:row; gap:12px; padding:14px 24px;
      justify-content:flex-start; border-bottom:none; border-radius:12px; margin:0 12px; }
    .nav-label { font-size:14px; display:block; }
    .nav-item.active { background:var(--green-pale); }
    .nav-icon { font-size:22px; }

    /* Main content shifted right of sidebar */
    .content { padding:20px 32px 40px; margin-left:280px; }
    .section { padding:20px 0 0; }
    
    /* Product grid \u2014 more columns on desktop */
    .products-grid { grid-template-columns:repeat(4,1fr); gap:16px; padding:0; }
    .product-card { padding:16px; }
    .product-emoji { font-size:48px; }
    
    /* Categories scroll */
    .categories-scroll { padding:0 0 4px; flex-wrap:wrap; overflow-x:visible; }

    /* Stats cards \u2014 more per row */
    .stat-cards { grid-template-columns:repeat(4,1fr) !important; }
    
    /* Orders and inventory \u2014 wider cards */
    .order-card, .inventory-item { max-width:100%; }

    /* Cart and checkout */
    .cart-item { padding:16px; }

    /* FAB buttons */
    .fab { right:32px; bottom:32px; }
    .fab-cam { right:32px; bottom:100px; }

    /* Manager tabs \u2014 horizontal scroll on desktop */
    .mgmt-tabs { flex-wrap:wrap; gap:8px; }
    .mgmt-tab { padding:10px 18px; }

    /* Modals \u2014 centered and wider on desktop */
    .modal-overlay { align-items:center; }
    .modal { border-radius:24px; max-width:520px; margin:auto; }

    /* Dashboard */
    .dash-section-title { font-size:18px; }

    /* Print page */
    .print-page { max-width:700px; margin:auto; padding:40px; }
  }

  @media (min-width:1200px) {
    .app { grid-template-columns:300px 1fr; }
    .bottom-nav { width:300px; }
    .content { margin-left:300px; padding:24px 48px 40px; }
    .products-grid { grid-template-columns:repeat(5,1fr); }
    .stat-cards { grid-template-columns:repeat(5,1fr) !important; }
    .fab { right:48px; }
    .fab-cam { right:48px; }
  }

  /* \u2500\u2500 LOGIN \u2500\u2500 */
  .login-page { min-height:100vh; display:flex; flex-direction:column; background:var(--cream); }
  .login-top { background:linear-gradient(160deg,#1a6b3c 0%,#2d9152 60%,#3aaf68 100%); padding:60px 32px 80px; text-align:center; position:relative; overflow:hidden; }
  .login-top::before { content:''; position:absolute; top:-60px; right:-60px; width:200px; height:200px; background:rgba(255,255,255,0.06); border-radius:50%; pointer-events:none; }
  .login-top::after { content:''; position:absolute; bottom:-40px; left:-40px; width:140px; height:140px; background:rgba(255,255,255,0.05); border-radius:50%; pointer-events:none; }
  .login-logo { width:80px; height:80px; background:rgba(255,255,255,0.15); border:3px solid rgba(255,255,255,0.3); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:36px; margin:0 auto 16px; position:relative; z-index:1; }
  .login-store { font-family:'Playfair Display',serif; color:white; font-size:22px; font-weight:700; position:relative; z-index:1; }
  .login-tagline { color:rgba(255,255,255,0.8); font-size:13px; margin-top:4px; position:relative; z-index:1; }
  .login-card { background:white; margin:-32px 20px 0; border-radius:24px; padding:32px 24px 28px; box-shadow:0 8px 40px rgba(0,0,0,0.12); position:relative; z-index:2; }
  .login-card h2 { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; margin-bottom:6px; }
  .login-card p { font-size:13px; color:var(--text-muted); margin-bottom:24px; line-height:1.5; }
  .login-tabs { display:flex; background:#f0ebe0; border-radius:12px; padding:4px; margin-bottom:24px; }
  .login-tab { flex:1; padding:9px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; border:none; background:transparent; color:var(--text-muted); font-family:'DM Sans',sans-serif; transition:all 0.2s; }
  .login-tab.active { background:white; color:var(--green); box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  .login-label { font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; display:block; }
  .login-input { width:100%; padding:14px 16px; border:2px solid #e8e4dc; border-radius:12px; font-size:15px; font-family:'DM Sans',sans-serif; outline:none; transition:border-color 0.2s; background:white; color:var(--text); }
  .login-input:focus { border-color:var(--green); }
  .login-input::placeholder { color:#bbb; }
  .login-hint { font-size:11px; color:var(--text-muted); margin-top:6px; margin-bottom:20px; }
  .login-btn { width:100%; background:var(--green); color:white; border:none; border-radius:14px; padding:16px; font-size:15px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background 0.2s; margin-top:4px; }
  .login-btn:hover { background:var(--green-light); }
  .login-btn:disabled { background:#b0c4b8; cursor:not-allowed; }
  .login-error { background:#fee2e2; color:#dc2626; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .login-footer { text-align:center; padding:20px; font-size:12px; color:var(--text-muted); }

  /* \u2500\u2500 HEADER \u2500\u2500 */
  .header { background:var(--green); padding:20px 20px 28px; position:relative; overflow:hidden; }
  .header::before { content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; background:rgba(255,255,255,0.07); border-radius:50%; pointer-events:none; }
  .header::after { content:''; position:absolute; bottom:-30px; left:30px; width:80px; height:80px; background:rgba(255,255,255,0.05); border-radius:50%; pointer-events:none; }
  .header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; position:relative; z-index:1; }
  .store-name { font-family:'Playfair Display',serif; color:white; font-size:17px; font-weight:700; letter-spacing:0.5px; }
  .header-right { display:flex; align-items:center; gap:8px; }
  .mode-toggle { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25); color:white; padding:6px 14px; border-radius:20px; cursor:pointer; font-size:12px; font-family:'DM Sans',sans-serif; font-weight:500; transition:all 0.2s; position:relative; z-index:1; }
  .mode-toggle:hover { background:rgba(255,255,255,0.25); }
  .logout-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; padding:6px 10px; border-radius:20px; cursor:pointer; font-size:11px; font-family:'DM Sans',sans-serif; font-weight:500; transition:all 0.2s; position:relative; z-index:1; }
  .logout-btn:hover { background:rgba(255,0,0,0.2); }
  .user-chip { background:rgba(255,255,255,0.15); border-radius:20px; padding:4px 10px; font-size:11px; color:white; font-weight:500; position:relative; z-index:1; }
  .search-bar { background:white; border-radius:14px; display:flex; align-items:center; padding:12px 16px; gap:10px; box-shadow:0 4px 16px rgba(0,0,0,0.12); margin:0 2px 2px; border:1.5px solid rgba(255,255,255,0.8); }
  .search-bar input { border:none; outline:none; flex:1; font-size:15px; font-family:'DM Sans',sans-serif; background:transparent; color:var(--text); }
  .search-bar input::placeholder { color:#a0a0a0; }
  .search-icon { color:var(--green); font-size:18px; flex-shrink:0; }

  /* \u2500\u2500 NAV \u2500\u2500 */
  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:430px; background:white; border-top:1px solid #e8e4dc; display:flex; z-index:100; box-shadow:0 -4px 20px rgba(0,0,0,0.08); }
  .nav-item { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 0 14px; cursor:pointer; gap:4px; transition:all 0.2s; color:var(--text-muted); border:none; background:transparent; font-family:'DM Sans',sans-serif; }
  .nav-item.active { color:var(--green); }
  .nav-item .icon { font-size:22px; }
  .nav-item .label { font-size:10px; font-weight:500; }
  .nav-badge { position:relative; display:inline-block; }
  .badge { position:absolute; top:-4px; right:-8px; background:var(--orange); color:white; font-size:9px; font-weight:700; padding:1px 5px; border-radius:10px; min-width:16px; text-align:center; }

  /* \u2500\u2500 CONTENT \u2500\u2500 */
  .content { padding:0 0 90px; }
  .section { padding:20px 20px 0; }
  .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .section-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; }
  .categories-scroll { display:flex; gap:10px; overflow-x:auto; padding:0 20px 4px; scrollbar-width:none; }
  .categories-scroll::-webkit-scrollbar { display:none; }
  .category-chip { display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; min-width:68px; padding:12px 8px; background:white; border-radius:14px; border:2px solid transparent; transition:all 0.2s; box-shadow:var(--shadow); }
  .category-chip.active { border-color:var(--green); background:var(--green-pale); }
  .category-chip .emoji { font-size:24px; }
  .category-chip .name { font-size:11px; font-weight:500; color:var(--text-muted); white-space:nowrap; }
  .category-chip.active .name { color:var(--green); }

  /* \u2500\u2500 PRODUCTS \u2500\u2500 */
  .products-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px; }

  .product-tamil { font-size:13px; font-weight:700; color:var(--text); margin-bottom:1px; }
  .inv-tamil { font-size:13px; font-weight:700; color:var(--text); }
  .cart-tamil { font-size:11px; color:var(--text-muted); margin-top:1px; }
  .product-unit { font-size:11px; color:var(--text-muted); margin-bottom:6px; }
  .product-footer { display:flex; justify-content:space-between; align-items:center; }
  .product-price { font-size:15px; font-weight:700; color:var(--green); }
  .add-btn { background:var(--green); color:white; border:none; width:28px; height:28px; border-radius:8px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
  .add-btn:hover { background:var(--green-light); }
  .stock-badge { position:absolute; top:10px; right:10px; background:#fef3e2; color:#d97706; font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px; }
  .out-badge { position:absolute; top:10px; right:10px; background:#fee2e2; color:#dc2626; font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px; }

  /* \u2500\u2500 HERO \u2500\u2500 */
  .hero-banner { margin:16px 20px 0; background:linear-gradient(135deg,var(--brown),#8b6914); border-radius:var(--radius); padding:20px; display:flex; justify-content:space-between; align-items:center; overflow:hidden; position:relative; }
  .hero-banner::after { content:'\u{1F6D2}'; position:absolute; right:16px; bottom:-8px; font-size:64px; opacity:0.2; pointer-events:none; }
  .hero-text h3 { color:white; font-family:'Playfair Display',serif; font-size:18px; font-weight:700; margin-bottom:4px; }
  .hero-text p { color:rgba(255,255,255,0.8); font-size:12px; }
  .hero-btn { background:white; color:var(--brown); border:none; border-radius:10px; padding:8px 16px; font-size:12px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; z-index:1; }

  /* \u2500\u2500 PAGES \u2500\u2500 */
  .page { padding:24px 20px 90px; }
  .page-title { font-family:'Playfair Display',serif; font-size:26px; font-weight:900; margin-bottom:20px; }
  .cart-item { background:white; border-radius:var(--radius-sm); padding:14px; display:flex; align-items:center; gap:12px; margin-bottom:10px; box-shadow:var(--shadow); }
  .cart-emoji { font-size:32px; }
  .cart-details { flex:1; }
  .cart-name { font-size:14px; font-weight:600; }
  .cart-price { font-size:13px; color:var(--green); font-weight:700; }
  .qty-controls { display:flex; align-items:center; gap:8px; }
  .qty-btn { width:28px; height:28px; border-radius:8px; border:1.5px solid var(--green); background:transparent; color:var(--green); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:700; transition:all 0.2s; }
  .qty-btn:hover { background:var(--green); color:white; }
  .qty-num { font-size:14px; font-weight:600; min-width:20px; text-align:center; }
  .cart-summary { background:white; border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-top:16px; }
  .summary-row { display:flex; justify-content:space-between; margin-bottom:10px; font-size:14px; color:var(--text-muted); }
  .summary-total { display:flex; justify-content:space-between; font-weight:700; font-size:17px; border-top:1px solid #e8e4dc; padding-top:12px; margin-top:4px; }

  /* \u2500\u2500 PAYMENT SECTION \u2500\u2500 */
  .pay-section { margin-top:20px; }
  .pay-title { font-size:16px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .pay-methods { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .pay-method {
    border:2px solid #e8e4dc; border-radius:14px; padding:14px 10px;
    text-align:center; cursor:pointer; transition:all 0.2s; background:white;
  }
  .pay-method.selected { border-color:var(--green); background:var(--green-pale); }
  .pay-method .pm-icon { font-size:28px; margin-bottom:6px; }
  .pay-method .pm-name { font-size:12px; font-weight:700; color:var(--text); }
  .pay-method .pm-sub { font-size:10px; color:var(--text-muted); margin-top:2px; }
  .pay-method.selected .pm-name { color:var(--green); }

  /* UPI QR Box */
  .upi-box { background:white; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); text-align:center; margin-bottom:16px; }
  .upi-box h4 { font-size:15px; font-weight:700; margin-bottom:4px; }
  .upi-box p { font-size:12px; color:var(--text-muted); margin-bottom:16px; }

  .upi-id-box { background:#f0f7f3; border-radius:10px; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .upi-id-text { font-size:13px; font-weight:600; color:var(--green); }
  .copy-btn { background:var(--green); color:white; border:none; border-radius:8px; padding:5px 12px; font-size:11px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .upi-apps { display:flex; justify-content:center; gap:16px; margin-top:4px; }
  .upi-app { text-align:center; }
  .upi-app-icon { font-size:28px; }
  .upi-app-name { font-size:10px; color:var(--text-muted); margin-top:2px; }

  /* COD box */
  .cod-box { background:white; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px; }
  .cod-box h4 { font-size:15px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .cod-box p { font-size:13px; color:var(--text-muted); line-height:1.6; }
  .cod-note { background:#fef3e2; border-radius:10px; padding:10px 14px; margin-top:12px; font-size:12px; color:#92400e; display:flex; align-items:center; gap:8px; }



  .place-order-btn { width:100%; background:var(--green); color:white; border:none; border-radius:14px; padding:16px; font-size:15px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; margin-top:4px; transition:background 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
  .place-order-btn:hover { background:var(--green-light); }
  .place-order-btn:disabled { background:#b0c4b8; cursor:not-allowed; }

  .empty-cart { text-align:center; padding:60px 20px; }
  .empty-emoji { font-size:64px; margin-bottom:16px; }
  .empty-title { font-family:'Playfair Display',serif; font-size:22px; margin-bottom:8px; }
  .empty-text { color:var(--text-muted); font-size:14px; }

  /* \u2500\u2500 ORDERS \u2500\u2500 */
  .order-card { background:white; border-radius:var(--radius-sm); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .order-id { font-size:13px; font-weight:700; }
  .order-status { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
  .status-pending { background:#fef3e2; color:#d97706; }
  .status-packed { background:#dbeafe; color:#1d4ed8; }
  .status-delivered { background:#dcfce7; color:#16a34a; }
  .status-processing { background:#f3e8ff; color:#7c3aed; }
  .order-items { font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .order-mobile { font-size:12px; color:var(--green); font-weight:600; margin-bottom:4px; }
  .order-payment { font-size:11px; color:var(--text-muted); margin-bottom:8px; display:flex; align-items:center; gap:4px; }
  .order-footer { display:flex; justify-content:space-between; }
  .order-total { font-size:14px; font-weight:700; color:var(--green); }
  .order-date { font-size:11px; color:var(--text-muted); }
  .track-steps { display:flex; align-items:center; margin:10px 0 4px; }
  .step { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
  .step.done { background:var(--green); color:white; }
  .step.current { background:var(--orange); color:white; }
  .step.todo { background:#e8e4dc; color:var(--text-muted); }
  .step-line { flex:1; height:3px; }
  .step-line.done { background:var(--green); }
  .step-line.todo { background:#e8e4dc; }

  /* \u2500\u2500 MANAGER \u2500\u2500 */
  .mgmt-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  @media (min-width:768px) { .mgmt-stats { grid-template-columns:repeat(4,1fr); } }
  @media (min-width:1200px) { .mgmt-stats { grid-template-columns:repeat(5,1fr); } }
  .stat-card { background:white; border-radius:var(--radius-sm); padding:16px; box-shadow:var(--shadow); cursor:pointer; transition:all 0.18s; border:2px solid transparent; user-select:none; }
  .stat-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--green-pale); }
  .stat-card:active { transform:scale(0.97); }
  .stat-card.active-card { border-color:var(--green); background:var(--green-pale); }
  .dash-back { display:flex; align-items:center; gap:8px; background:var(--green-pale); color:var(--green); border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:16px; font-family:"DM Sans",sans-serif; }
  .dash-section-title { font-family:"Playfair Display",serif; font-size:18px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .sales-dropdown-wrap { position:relative; }
  .sales-period-btn { background:var(--green); color:white; border:none; border-radius:10px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:"DM Sans",sans-serif; display:flex; align-items:center; gap:6px; }
  .sales-dropdown { position:absolute; top:calc(100% + 6px); right:0; background:white; border-radius:12px; box-shadow:var(--shadow-lg); overflow:hidden; z-index:50; min-width:160px; border:1px solid #e8e4dc; }
  .sales-option { padding:11px 16px; font-size:13px; font-weight:500; cursor:pointer; transition:background 0.15s; display:flex; justify-content:space-between; align-items:center; }
  .sales-option:hover { background:var(--green-pale); color:var(--green); }
  .sales-option.active { background:var(--green-pale); color:var(--green); font-weight:700; }
  .sales-big { font-family:"Playfair Display",serif; font-size:32px; font-weight:900; color:var(--green); margin:8px 0 4px; }
  .sales-chart-bar { background:var(--green-pale); border-radius:var(--radius); padding:16px; margin-top:16px; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar-label { font-size:11px; color:var(--text-muted); width:28px; text-align:right; flex-shrink:0; }
  .bar-track { flex:1; background:#e8e4dc; border-radius:4px; height:10px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--green); border-radius:4px; transition:width 0.4s ease; }
  .bar-val { font-size:11px; font-weight:700; color:var(--green); width:44px; }
  .empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:14px; }
  .empty-state .e-icon { font-size:40px; margin-bottom:10px; }
  .stat-icon { font-size:24px; margin-bottom:6px; }
  .stat-value { font-size:22px; font-weight:700; font-family:'Playfair Display',serif; }
  .stat-label { font-size:11px; color:var(--text-muted); font-weight:500; }
  .mgmt-tabs { display:flex; gap:8px; margin-bottom:16px; }
  .mgmt-tab { padding:7px 16px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:1.5px solid #e0dbd0; background:transparent; color:var(--text-muted); font-family:'DM Sans',sans-serif; transition:all 0.2s; }
  .mgmt-tab.active { background:var(--green); color:white; border-color:var(--green); }
  .inventory-item { background:white; border-radius:var(--radius-sm); padding:14px; display:flex; align-items:center; gap:12px; margin-bottom:8px; box-shadow:var(--shadow); transition:opacity 0.2s; }
  .inventory-item.inactive-row { opacity:0.5; }
  .inv-emoji { font-size:28px; }
  .inv-details { flex:1; min-width:0; }
  .inv-name { font-size:11px; font-weight:400; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .inv-sku { font-size:11px; color:var(--text-muted); }
  .inv-right { display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex-shrink:0; }
  .inv-stock { font-size:15px; font-weight:700; }
  .inv-stock.low { color:var(--red); }
  .inv-stock.ok { color:var(--green); }
  .inv-price { font-size:11px; color:var(--text-muted); }
  .inv-actions { display:flex; gap:4px; margin-top:2px; }
  .edit-stock-btn { background:var(--green-pale); color:var(--green); border:none; border-radius:7px; padding:5px 8px; font-size:12px; cursor:pointer; }
  .toggle-btn { border:none; border-radius:7px; padding:5px 8px; font-size:11px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .toggle-btn.on { background:#dcfce7; color:#16a34a; }
  .toggle-btn.off { background:#f1f5f9; color:#64748b; }
  .delete-btn { background:#fee2e2; color:var(--red); border:none; border-radius:7px; padding:5px 8px; font-size:12px; cursor:pointer; }

  /* \u2500\u2500 FAB \u2500\u2500 */
  .fab { position:fixed; bottom:28px; right:calc(50% - 215px + 16px); width:54px; height:54px; border-radius:50%; background:var(--green); color:white; border:none; font-size:28px; cursor:pointer; box-shadow:0 4px 20px rgba(26,107,60,0.45); display:flex; align-items:center; justify-content:center; z-index:101; transition:transform 0.2s; }
  .fab:hover { transform:scale(1.1); }
  .fab-cam { position:fixed; bottom:96px; right:calc(50% - 215px + 16px); width:48px; height:48px; border-radius:50%; background:#1d4ed8; color:white; border:none; font-size:22px; cursor:pointer; box-shadow:0 4px 16px rgba(29,78,216,0.45); display:flex; align-items:center; justify-content:center; z-index:101; transition:transform 0.2s; }
  .fab-cam:hover { transform:scale(1.1); }

  /* \u2500\u2500 BARCODE SCANNER MODAL \u2500\u2500 */
  .scanner-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.92); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:40px; }
  .scanner-header { color:white; font-size:18px; font-weight:700; margin-bottom:8px; font-family:'Playfair Display',serif; }
  .scanner-sub { color:rgba(255,255,255,0.6); font-size:13px; margin-bottom:20px; text-align:center; padding:0 20px; }
  .scanner-video-wrap { position:relative; width:300px; height:300px; border-radius:16px; overflow:hidden; border:3px solid #e8b820; }
  .scanner-video-wrap video { width:100%; height:100%; object-fit:cover; }
  .scanner-line { position:absolute; top:50%; left:0; right:0; height:2px; background:#e8b820; box-shadow:0 0 8px #e8b820; animation:scan 2s linear infinite; }
  @keyframes scan { 0%{top:20%} 50%{top:80%} 100%{top:20%} }
  .scanner-corners::before,.scanner-corners::after { content:''; position:absolute; width:24px; height:24px; border-color:#e8b820; border-style:solid; border-width:0; }
  .scanner-corners::before { top:8px; left:8px; border-top-width:3px; border-left-width:3px; border-radius:4px 0 0 0; }
  .scanner-corners::after  { bottom:8px; right:8px; border-bottom-width:3px; border-right-width:3px; border-radius:0 0 4px 0; }
  .scanner-result { background:white; border-radius:12px; padding:12px 18px; margin-top:16px; width:300px; text-align:center; font-size:14px; font-weight:600; color:var(--green); }
  .scanner-close { margin-top:16px; color:white; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); padding:12px 32px; border-radius:12px; font-size:15px; cursor:pointer; font-family:'DM Sans',sans-serif; }

  /* \u2500\u2500 MODALS \u2500\u2500 */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
  .modal { background:white; border-radius:24px 24px 0 0; padding:24px 20px 40px; width:100%; max-width:430px; animation:slideUp 0.3s ease; max-height:90vh; overflow-y:auto; }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-handle { width:40px; height:4px; background:#e0dbd0; border-radius:2px; margin:0 auto 20px; }
  .modal-title { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; margin-bottom:16px; }
  .modal-label { font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; display:block; }
  .modal-input { width:100%; padding:12px 14px; border:1.5px solid #e0dbd0; border-radius:10px; font-size:14px; margin-bottom:14px; font-family:'DM Sans',sans-serif; outline:none; }
  .modal-input:focus { border-color:var(--green); }
  .modal-select { width:100%; padding:12px 14px; border:1.5px solid #e0dbd0; border-radius:10px; font-size:14px; margin-bottom:14px; font-family:'DM Sans',sans-serif; outline:none; background:white; }
  .modal-btn { width:100%; background:var(--green); color:white; border:none; border-radius:12px; padding:14px; font-size:14px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .modal-close { float:right; background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-muted); line-height:1; }
  .modal-row { display:flex; gap:10px; }
  .modal-row > div { flex:1; }
  .emoji-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:14px; }
  .emoji-opt { font-size:22px; text-align:center; padding:6px 4px; border-radius:8px; cursor:pointer; border:2px solid transparent; transition:all 0.15s; }
  .emoji-opt.selected { border-color:var(--green); background:var(--green-pale); }
  .emoji-opt:hover { background:var(--green-pale); }
  .confirm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; display:flex; align-items:center; justify-content:center; padding:24px; }
  .confirm-modal { background:white; border-radius:20px; padding:28px 24px; width:100%; max-width:340px; text-align:center; animation:popIn 0.2s ease; }
  @keyframes popIn { from{transform:scale(0.9);opacity:0} to{transform:scale(1);opacity:1} }
  .confirm-emoji { font-size:48px; margin-bottom:12px; }
  .confirm-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; margin-bottom:8px; }
  .confirm-text { font-size:13px; color:var(--text-muted); margin-bottom:20px; line-height:1.5; }
  .confirm-btns { display:flex; gap:10px; }
  .confirm-cancel { flex:1; padding:12px; border-radius:10px; border:1.5px solid #e0dbd0; background:transparent; font-size:14px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .confirm-delete { flex:1; padding:12px; border-radius:10px; border:none; background:var(--red); color:white; font-size:14px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .success-toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--green); color:white; padding:10px 20px; border-radius:20px; font-size:13px; font-weight:600; z-index:400; animation:fadeToast 2.2s forwards; white-space:nowrap; }
  @keyframes fadeToast { 0%{opacity:0;transform:translateX(-50%) translateY(-10px)} 12%{opacity:1;transform:translateX(-50%) translateY(0)} 78%{opacity:1} 100%{opacity:0} }

  /* \u2500\u2500 CATEGORY MANAGEMENT \u2500\u2500 */
  .cat-manage-card { background:white; border-radius:14px; box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; border:1.5px solid #e8e4dc; }
  .cat-manage-header { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; transition:background 0.15s; }
  .cat-manage-header:hover { background:var(--green-pale); }
  .cat-manage-emoji { font-size:28px; flex-shrink:0; }
  .cat-manage-info { flex:1; }
  .cat-manage-name { font-size:15px; font-weight:700; }
  .cat-manage-tamil { font-size:12px; color:var(--green); }
  .cat-manage-count { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .cat-manage-chevron { color:var(--text-muted); font-size:16px; transition:transform 0.2s; }

  .cat-products-panel { padding:0 14px 14px; border-top:1px solid #f0ebe0; }
  .cat-product-chip { display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--green-pale); border-radius:10px; margin-bottom:6px; }
  .cat-product-chip-emoji { font-size:18px; }
  .cat-product-chip-info { flex:1; }
  .cat-product-chip-name { font-size:11px; font-weight:400; color:var(--text-muted); }
  .cat-product-chip-tamil { font-size:12px; font-weight:700; color:var(--text); }

  /* \u2500\u2500 NOTIFICATION BELL \u2500\u2500 */

  .notif-panel { position:fixed; top:0; right:0; width:min(360px,100vw); height:100vh; background:white; box-shadow:-4px 0 30px rgba(0,0,0,0.15); z-index:300; display:flex; flex-direction:column; animation:slideInRight 0.25s ease; }

  .notif-order-id { font-size:13px; font-weight:700; color:var(--green); }

  .notif-total { font-size:13px; font-weight:700; color:var(--green); }

  .notif-overlay-bg { position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:299; }

  /* \u2500\u2500 PRINT PREVIEW MODAL \u2500\u2500 */

  /* \u2500\u2500 PRINT MEDIA \u2500\u2500 */

    .print-preview-toolbar { display:none !important; }
